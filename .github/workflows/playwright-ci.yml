
name: AI QA - Playwright CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm run test:unit

      - name: TypeScript validation
        run: npm run typecheck

      - name: Validate Jira test specifications
        shell: bash
        run: |
          shopt -s nullglob
          specs=(tests/specifications/*.json)

          if (( ${#specs[@]} == 0 )); then
            echo "No test specifications found"
            exit 1
          fi

          for spec in "${specs[@]}"; do
            npm run validate:spec -- "$spec"
          done

      - name: Execute Playwright E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
