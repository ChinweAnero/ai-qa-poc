
name: AI Test Generation

on:
  repository_dispatch:
    types: [jira_ready_for_automation]
  workflow_dispatch:
    inputs:
      issue_key:
        description: Jira issue key
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-qa-generation
  cancel-in-progress: false

jobs:
  generate-tests:
    runs-on: [self-hosted, macOS, ai-qa-generation]
    timeout-minutes: 90

    outputs:
      issue_key: ${{ steps.jira.outputs.issue_key }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Jira key
        id: jira
        shell: bash
        env:
          DISPATCH_ISSUE: ${{ github.event.client_payload.issue_key }}
          MANUAL_ISSUE: ${{ inputs.issue_key }}
        run: |
          ISSUE_KEY="${DISPATCH_ISSUE:-$MANUAL_ISSUE}"

          if [[ ! "$ISSUE_KEY" =~ ^[A-Z][A-Z0-9]*-[0-9]+$ ]]; then
            echo "Invalid Jira issue key"
            exit 1
          fi

          echo "issue_key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install chromium

      - name: Analyse requirements
        env:
          JIRA_KEY: ${{ steps.jira.outputs.issue_key }}
        run: |
          ./scripts/analyse-jira.sh "$JIRA_KEY"

      - name: Generate Playwright tests
        env:
          JIRA_KEY: ${{ steps.jira.outputs.issue_key }}
        run: |
          ./scripts/generate-tests.sh "$JIRA_KEY"

      - name: Prepare generated artifacts
        env:
          JIRA_KEY: ${{ steps.jira.outputs.issue_key }}
        run: |
          mkdir -p artifacts/tests/specifications
          mkdir -p artifacts/tests/plans
          mkdir -p artifacts/tests/e2e
          cp "tests/specifications/${JIRA_KEY}.json" \
             artifacts/tests/specifications/
          cp "tests/plans/${JIRA_KEY}.md" \
             artifacts/tests/plans/
          cp "tests/e2e/${JIRA_KEY}.spec.ts" \
             artifacts/tests/e2e/

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-tests
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  
  create-pr:
    needs: generate-tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AI_QA_APP_CLIENT_ID }}
          private-key: ${{ secrets.AI_QA_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Download generated tests
        uses: actions/download-artifact@v4
        with:
          name: generated-tests
          path: .

      - name: Inspect downloaded artifacts
        run: |
          echo "Current directory:"
          pwd

          echo "Downloaded files:"
          find . -maxdepth 5 -type f \
            \( -name 'SCRUM-5*' -o -name '*.spec.ts' \) \
            -print

      - name: Verify generated artifacts
        env:
          JIRA_KEY: ${{ needs.generate-tests.outputs.issue_key }}
        run: |
          for file in \
            "tests/specifications/${JIRA_KEY}.json" \
            "tests/plans/${JIRA_KEY}.md" \
            "tests/e2e/${JIRA_KEY}.spec.ts"
          do
            if [[ ! -s "$file" ]]; then
              echo "ERROR: Missing artifact: $file"
              exit 1
            fi

            echo "Found: $file"
          done

      - name: Create draft PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          JIRA_KEY: ${{ needs.generate-tests.outputs.issue_key }}
        run: |
          ./scripts/publish-ai-pr.sh "$JIRA_KEY"

      
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: generated-tests
          path: .

      - name: Create draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          JIRA_KEY: ${{ needs.generate-tests.outputs.issue_key }}
        run: |
          ./scripts/publish-ai-pr.sh "$JIRA_KEY"

      - name: Report PR
        run: |
          echo "Draft PR: $PR_URL"

  
  report-to-jira:
    if: always()
    needs:
      - generate-tests
      - create-pr

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Report automation result
        env:
          JIRA_KEY: ${{ needs.generate-tests.outputs.issue_key }}
          GENERATION_RESULT: ${{ needs.generate-tests.result }}
          PR_RESULT: ${{ needs.create-pr.result }}
          GH_TOKEN: ${{ github.token }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        shell: bash
        run: |
          if [[ ! "$JIRA_KEY" =~ ^[A-Z][A-Z0-9]*-[0-9]+$ ]]; then
            echo "No valid Jira issue key to report."
            exit 1
          fi

          if [[ "$GENERATION_RESULT" == "success" &&
                "$PR_RESULT" == "success" ]]; then
            RESULT="success"

            PR_URL=$(gh pr list \
              --head "ai-tests/$JIRA_KEY" \
              --state open \
              --json url \
              --jq '.[0].url // empty')

            if [[ -z "$PR_URL" ]]; then
              echo "Expected PR was not found."
              exit 1
            fi
          else
            RESULT="failed"
            PR_URL=""
          fi

          ./scripts/report-to-jira.sh \
            "$JIRA_KEY" "$RESULT" "$PR_URL"
