
name: AI Test Generation

on:
  repository_dispatch:
    types: [jira_ready_for_automation]
  workflow_dispatch:
    inputs:
      issue_key:
        description: Jira issue key
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-qa-generation
  cancel-in-progress: false

jobs:
  analyse-jira:
    runs-on: [self-hosted, macOS, ai-qa-generation]
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Jira issue key
        id: jira
        shell: bash
        env:
          DISPATCH_ISSUE: ${{ github.event.client_payload.issue_key }}
          MANUAL_ISSUE: ${{ inputs.issue_key }}
        run: |
          ISSUE_KEY="${DISPATCH_ISSUE:-$MANUAL_ISSUE}"

          if [[ ! "$ISSUE_KEY" =~ ^[A-Z][A-Z0-9]*-[0-9]+$ ]]; then
            echo "Invalid Jira issue key"
            exit 1
          fi

          echo "issue_key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Analyse Jira requirements
        env:
          JIRA_KEY: ${{ steps.jira.outputs.issue_key }}
        run: |
          ./scripts/analyse-jira.sh "$JIRA_KEY"

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jira-analysis
          path: |
            tests/specifications/*.json
            tests/plans/*.md
          if-no-files-found: warn
          retention-days: 7
